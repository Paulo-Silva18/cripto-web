<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Criptografia Web{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">🔐 Criptografia Web</a>
        <nav>
            <a href="{{ url_for('simetrico') }}">Módulo Simétrico (DES)</a>
            <a href="{{ url_for('assimetrico') }}">Módulo Assimétrico (RSA)</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Implementação Web de Algoritmos Criptográficos — Segurança da Informação (IFTM)</p>
    </footer>
</body>
</html>
